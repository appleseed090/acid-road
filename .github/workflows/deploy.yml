name: Check and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling a deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test against the built site
        run: npm run test:smoke
      - name: Upload smoke test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify-live:
    name: Smoke test the live site
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SMOKE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # Pages can serve the previous build for a short while after a deploy reports success.
      - name: Wait for the live page to serve this commit's build
        run: |
          npm run build
          expected=$(grep -o 'assets/index-[^"]*\.js' dist/index.html)
          for attempt in $(seq 1 30); do
            if curl -fsS "$SMOKE_BASE_URL" | grep -q "$expected"; then echo "Live page serves $expected"; exit 0; fi
            sleep 10
          done
          echo "Live page never served $expected"
          exit 1
      - name: Smoke test against the live site
        run: npx playwright test
      - name: Upload live smoke test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-live
          path: |
            playwright-report/
            test-results/
